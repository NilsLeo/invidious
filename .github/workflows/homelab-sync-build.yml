name: Homelab sync upstream and build image

# Keeps this fork's single "hide shorts" patch rebased on top of the latest
# iv-org/invidious master, then builds and publishes a container image to GHCR
# so the homelab can pull an up-to-date, patched Invidious.

on:
  schedule:
    # Weekly, Monday 04:00 UTC. Scheduled runs use the default branch, which
    # must be `homelab-hide-shorts` for this to fire.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: homelab-sync-build
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch (full history)
        uses: actions/checkout@v6
        with:
          ref: homelab-hide-shorts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase patch onto upstream master
        run: |
          git remote add upstream https://github.com/iv-org/invidious.git
          git fetch --no-tags upstream master
          # Fails loudly (and notifies) if the patch ever conflicts with upstream.
          git rebase upstream/master

      - name: Push rebased patch branch (best-effort)
        # The built-in GITHUB_TOKEN cannot push changes to .github/workflows/**
        # files. When upstream updates a workflow file, the rebased force-push
        # includes that change and GitHub rejects it. That's fine: the image is
        # built from the local rebased tree below regardless, so a rejected
        # branch push must not fail the run. (Use a PAT with `workflow` scope
        # here if you ever need the remote branch kept fully rebased.)
        run: |
          git push --force-with-lease origin homelab-hide-shorts \
            || echo "::warning::branch push skipped (workflow-file perms); image still builds from rebased tree"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nilsleo/invidious:latest
          build-args: |
            "release=1"
